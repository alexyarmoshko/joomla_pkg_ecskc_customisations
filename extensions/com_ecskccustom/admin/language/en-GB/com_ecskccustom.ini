; Dashboard. The version and author come from the installed manifest.
COM_ECSKCCUSTOM_DASHBOARD_TITLE="ECSKC Customisations: Dashboard"
COM_ECSKCCUSTOM_DASHBOARD_DESC="This component keeps the ECSKC changes to other extensions' files in place. Each change is declared in the package with the file it applies to and the hashes that file may have. Open Customisations to see the state of every managed file."
COM_ECSKCCUSTOM_FEATURE_CHECK="Checks every managed file against the hashes declared for it"
COM_ECSKCCUSTOM_FEATURE_REPORT="Shows the expected hash, the actual hash, and the last package write for each file that is not ok"
COM_ECSKCCUSTOM_FEATURE_DRY_RUN="Shows what a write would change before it changes anything"
COM_ECSKCCUSTOM_FEATURE_HISTORY="Backs up each file before replacing it and records every write, so a change can be reverted and redone"
COM_ECSKCCUSTOM_FEATURE_FREEZE="Freezes a file so the package leaves the site's own version alone"
