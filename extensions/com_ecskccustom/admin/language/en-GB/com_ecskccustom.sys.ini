COM_ECSKCCUSTOM="ECSKC Customisations"
COM_ECSKCCUSTOM_XML_DESCRIPTION="Checks the declared ECSKC customisations, reports their state, and changes files only when it can prove the change is safe."
COM_ECSKCCUSTOM_SUBMENU_DASHBOARD="Dashboard"
COM_ECSKCCUSTOM_SUBMENU_TARGETS="Customisations"

; Installer failures. These belong here and not in com_ecskccustom.ini:
; InstallerAdapter::doLoadLanguage() loads <extension>.sys only, so a key
; defined in the runtime file renders as its own name at install time -
; the operator would be told COM_ECSKCCUSTOM_ERROR_STATE_PROTECTION and not
; which folder is unprotected.
COM_ECSKCCUSTOM_ERROR_STATE_FOLDER="The ECSKC Customisations component could not create its %s folder. The component cannot record backups or its event log until that folder exists and is writable."
COM_ECSKCCUSTOM_ERROR_STATE_PROTECTION="The ECSKC Customisations component could not write the deny-all .htaccess into %s. Do not use the component until that folder is unreachable over HTTP."

; Install and update. Nothing is applied during installation, brief decision 2. The
; link opens the read-only whole-set check, never a write task.
COM_ECSKCCUSTOM_INSTALL_REVIEW_AND_APPLY="ECSKC Customisations changed no site file while installing. Review its customisations and apply them: <a href=\"%s\">open the check</a> to see what applying would change, then apply from there."

; Uninstall. Joomla deletes backup/, staging/ and state/ with the component, so
; the hook copies the history out first and these say where it went.
COM_ECSKCCUSTOM_UNINSTALL_ARCHIVED="Uninstalling ECSKC Customisations deletes its backups, freeze markers and event log. They were saved first to %s. Nothing reads that archive back: keep the file if you may need the history, and delete it when you do not."
; One key per reason the core reports, so the operator reads their own language and
; not an exception message. Each takes the path the failure is about, except the
; run-locked one: a contended lock is the package's own file, about to be deleted
; with the tree, so naming it would send the operator to a path that no longer
; exists. That key therefore carries no %s and is enqueued without a path.
;
; Past tense throughout: the hook runs before Joomla deletes the component, but these
; messages are rendered at the end of that request, by which time the folders are gone.
COM_ECSKCCUSTOM_UNINSTALL_ARCHIVE_RUN_LOCKED="ECSKC Customisations could not save its backups, freeze markers and event log before uninstalling because a write was in progress. They have been deleted with the component."
COM_ECSKCCUSTOM_UNINSTALL_ARCHIVE_REPORT_READING="ECSKC Customisations could not save its backups, freeze markers and event log before uninstalling because a check or dry run was reading them. They have been deleted with the component."
COM_ECSKCCUSTOM_UNINSTALL_ARCHIVE_LOCK_UNAVAILABLE="ECSKC Customisations could not save its backups, freeze markers and event log before uninstalling because its run lock could not be opened. They have been deleted with the component."
COM_ECSKCCUSTOM_UNINSTALL_ARCHIVE_UNREADABLE="ECSKC Customisations could not read %s, so its backups, freeze markers and event log were not saved before uninstalling. They have been deleted with the component."
COM_ECSKCCUSTOM_UNINSTALL_ARCHIVE_UNWRITABLE="ECSKC Customisations could not write its backups, freeze markers and event log to %s before uninstalling. They have been deleted with the component. Check that the folder exists, is writable, and is not a symbolic link."
COM_ECSKCCUSTOM_UNINSTALL_ARCHIVE_UNSECURED="ECSKC Customisations could not protect the archive of its backups, freeze markers and event log at %s, so it was discarded rather than left where anything could read it. They have been deleted with the component."
COM_ECSKCCUSTOM_UNINSTALL_ARCHIVE_UNPUBLISHED="ECSKC Customisations could not save its backups, freeze markers and event log to %s before uninstalling. They have been deleted with the component."
COM_ECSKCCUSTOM_UNINSTALL_ARCHIVE_FAILED="ECSKC Customisations could not save its backups, freeze markers and event log before uninstalling. They have been deleted with the component. The reason is in the com_ecskccustom log."
